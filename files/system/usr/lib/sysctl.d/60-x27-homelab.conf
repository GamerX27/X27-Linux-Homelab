# UDP buffer size quic-go asks for, so AdGuard Home's DNS-over-QUIC/HTTP3 doesn't warn
# "failed to sufficiently increase receive buffer size".
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# Console (login screen) shows only kernel errors. Otherwise every container start prints
# bridge/veth state changes over the login prompt. Everything stays in journalctl -k.
kernel.printk = 3 4 1 3

# Docker may publish ports on the cluster's virtual IP while this node doesn't hold it (an
# HA app with "ports only on the virtual IP" starting during a handover). Without this, the
# bind fails with "cannot assign requested address".
net.ipv4.ip_nonlocal_bind = 1
