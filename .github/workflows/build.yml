name: build
on:
  schedule:
    - cron: "0 2 * * 0" # rebuild weekly, Sundays at 02:00 UTC, to pick up upstream Fedora/Docker updates
  push:
    paths:
      - "recipes/**"
      - "files/**"
      - "dashboard/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-image.yml"
    branches:
      - main
      - testing
  pull_request:
    paths:
      - "recipes/**"
      - "files/**"
      - "dashboard/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build (all runs both)"
        required: false
        default: all
        type: choice
        options:
          - all
          - recipe.yml
          - recipe-vm.yml

# Both images build straight from quay.io/fedora/fedora-bootc, so they run in parallel.
# main is production (Fedora 44: :44, :latest, :<date>-44). testing builds Fedora 45 and
# BlueBuild tags its images :br-testing-45, so they never replace the production tags.
# Every job is gated on github.server_url so the Forgejo mirror (git.xlabsx27.com), whose
# Actions also read .github/workflows, skips them; they only run on GitHub.
jobs:
  bare-metal:
    if: >-
      github.server_url == 'https://github.com'
      && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","recipe.yml"]'), inputs.recipe))
    uses: ./.github/workflows/build-image.yml
    with:
      recipe: recipe.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  vm:
    if: >-
      github.server_url == 'https://github.com'
      && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","recipe-vm.yml"]'), inputs.recipe))
    uses: ./.github/workflows/build-image.yml
    with:
      recipe: recipe-vm.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  # Scheduled runs only fire on the default branch, so the weekly rebuild starts the
  # testing branch's build from here.
  testing-weekly:
    if: github.server_url == 'https://github.com' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start the testing build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref testing

  # A GitHub Release per build (main only), with what changed (scripts/release-notes.sh). The weekly
  # scheduled build is vYYYY.MM.DD; pushes and dispatches are minor releases vYYYY.MM.DD.N.
  # Runs when no image build failed; a single-recipe dispatch skips the other image, which
  # the notes then take from its last published :44.
  release:
    needs: [bare-metal, vm]
    if: >-
      always() && github.server_url == 'https://github.com' && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: ./scripts/release-notes.sh
