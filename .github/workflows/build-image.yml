name: build-image
on:
  workflow_call:
    inputs:
      recipe:
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.recipe }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number counts today's commits

      # The build number: the date, how many commits went into the branch that day (left out
      # when none did, as in a rebuild without changes), and the branch for anything but main:
      # 2026.10.28.3-testing, or 2026.10.28.3 on main. The image build reads it from
      # build-number (recipes and common.yml); BlueBuild builds this checkout (skip_checkout).
      - name: Build number
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          n="$(git rev-list --count --since="$(date -u +%Y-%m-%d)T00:00:00Z" HEAD)"
          v="$(date -u +%Y.%m.%d)"
          if [ "$n" -gt 0 ]; then v="${v}.${n}"; fi
          if [ "$BRANCH" != main ]; then v="${v}-${BRANCH//\//-}"; fi
          echo "Build number: ${v}"
          echo "$v" > build-number
          cp build-number dashboard/build-number

      - name: Build custom image
        uses: blue-build/github-action@v1.10
        with:
          skip_checkout: true
          recipe: ${{ inputs.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

      # BlueBuild only gives non-default-branch builds br-<branch>-<version> tags, so the
      # testing images get the usual :<version>, :latest and :<date>-<version> here. Same
      # registry and digest, so the cosign signature still matches. main already gets
      # those tags from BlueBuild and has no br- tag to copy from.
      - name: Add version tags
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        env:
          RECIPE: recipes/${{ inputs.recipe }}
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          name="$(yq '.name' "$RECIPE")"
          version="$(yq '.image-version' "$RECIPE")"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          src="ghcr.io/${owner}/${name}:br-${GITHUB_REF_NAME//\//_}-${version}"
          echo "$TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$version" latest "$(date -u +%Y%m%d)-${version}"; do
            echo "${src} -> :${tag}"
            skopeo copy --all --preserve-digests "docker://${src}" "docker://ghcr.io/${owner}/${name}:${tag}"
          done
