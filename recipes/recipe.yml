---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux-homelab-alma-testing
description: X27-Linux Homelab AlmaLinux testing (bare metal, AlmaLinux 10) - minimal headless AlmaLinux bootc with Docker CE and SSH
base-image: quay.io/almalinuxorg/almalinux-bootc
image-version: 10

# Compiles the dashboard (dashboard/, Go) on the base image itself, so the cgo PAM binding
# links against the same glibc and libpam. Not the smaller almalinux:10 container: it lacks jq,
# so BlueBuild's setup script tries to install coreutils, which conflicts with its
# coreutils-single. On the bootc image /root points into /var, which is empty during a build,
# so Go's caches go in /tmp. Tests run first: a failing test fails the image build.
# common.yml copies the binary in.
stages:
  - name: dashboard
    from: quay.io/almalinuxorg/almalinux-bootc:10
    modules:
      - type: containerfile
        snippets:
          - COPY dashboard /src
          - |
            RUN set -eu \
                && dnf -y install --setopt=install_weak_deps=False golang pam-devel \
                && cd /src \
                && export GOFLAGS=-mod=readonly CGO_ENABLED=1 GOPATH=/tmp/go GOCACHE=/tmp/go-cache \
                && go vet ./... \
                && go test ./... \
                && go build -trimpath -ldflags "-s -w -X main.version=$(date -u +%Y.%m.%d)" -o /out/dashboard . \
                && /out/dashboard help >/dev/null

modules:
  # Disk health, GPU and temperature/fan monitoring on real hardware. linux-firmware comes with the base image.
  # A containerfile step, not BlueBuild's dnf module, which needs dnf5 (AlmaLinux 10 has dnf4).
  # nvtop comes from EPEL.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && dnf -y install epel-release \
            && dnf -y install --setopt=install_weak_deps=False smartmontools nvme-cli nvtop lm_sensors \
            && dnf clean all \
            && rpm -q smartmontools nvme-cli nvtop lm_sensors

  - type: systemd
    system:
      enabled:
        - smartd.service

  - from-file: common.yml
