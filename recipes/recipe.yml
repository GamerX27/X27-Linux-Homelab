---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux-homelab-testing
description: X27-Linux Homelab testing (bare metal, Fedora 45) - minimal headless Fedora bootc with Docker CE and SSH
base-image: quay.io/fedora/fedora-bootc
image-version: 45

# Compiles the dashboard (dashboard/, Go) on the same Fedora release as the image, so the
# cgo PAM binding links against the same glibc and libpam. Tests run first: a failing test
# fails the image build. common.yml copies the binary in.
stages:
  - name: dashboard
    from: quay.io/fedora/fedora:45
    modules:
      - type: containerfile
        snippets:
          - COPY dashboard /src
          - |
            RUN set -eu \
                && dnf5 -y install --setopt=install_weak_deps=False golang pam-devel \
                && cd /src \
                && export GOFLAGS=-mod=readonly CGO_ENABLED=1 \
                && go vet ./... \
                && go test ./... \
                && go build -trimpath -ldflags "-s -w -X main.version=$(date -u +%Y.%m.%d)" -o /out/dashboard . \
                && /out/dashboard help >/dev/null

modules:
  # Disk health, GPU and temperature/fan monitoring on real hardware. linux-firmware comes with the base image.
  - type: dnf
    install:
      packages:
        - smartmontools
        - nvme-cli
        - nvtop
        - lm_sensors

  - type: systemd
    system:
      enabled:
        - smartd.service

  - from-file: common.yml
