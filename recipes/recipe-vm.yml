---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux-homelab-vm
description: X27-Linux Homelab (VM) - minimal headless Fedora bootc with Docker CE, SSH, and the QEMU guest agent
base-image: quay.io/fedora/fedora-bootc
image-version: 45

# Compiles the dashboard (dashboard/, Go) on the same Fedora release as the image, so the
# cgo PAM binding links against the same glibc and libpam. Tests run first: a failing test
# fails the image build. common.yml copies the binary in.
stages:
  - name: dashboard
    from: quay.io/fedora/fedora:45
    modules:
      - type: containerfile
        snippets:
          - COPY dashboard /src
          - |
            RUN set -eu \
                && dnf5 -y install --setopt=install_weak_deps=False golang pam-devel \
                && cd /src \
                && export GOFLAGS=-mod=readonly CGO_ENABLED=1 \
                && go vet ./... \
                && go test ./... \
                && go build -trimpath -ldflags "-s -w -X main.version=$(date -u +%Y.%m.%d)" -o /out/dashboard . \
                && /out/dashboard help >/dev/null

modules:
  # Hardware firmware blobs and CPU microcode do nothing in a VM (the hypervisor handles
  # microcode). kernel-core only Recommends linux-firmware, so the kernel stays.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && FIRMWARE="$(rpm -qa --queryformat '%{NAME}\n' | grep -E -- '-firmware$|^linux-firmware|^microcode_ctl$' || true)" \
            && echo "Removing:" ${FIRMWARE} \
            && if [ -n "${FIRMWARE}" ]; then dnf5 -y remove --no-autoremove ${FIRMWARE}; fi \
            && dnf5 clean all \
            && rpm -q kernel-core bootc

  - type: dnf
    install:
      packages:
        - qemu-guest-agent

  - type: systemd
    system:
      enabled:
        - qemu-guest-agent.service

  - from-file: common.yml
