---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux-homelab-vm-alma-testing
description: X27-Linux Homelab AlmaLinux testing (VM, AlmaLinux 10) - minimal headless AlmaLinux bootc with Docker CE, SSH, and the QEMU guest agent
base-image: ghcr.io/gamerx27/x27-base-almalinux-bootc
image-version: 10

# Builds from a frozen copy of quay.io/almalinuxorg/almalinux-bootc:10, refreshed monthly (see
# .github/workflows/build.yml).
#
# Compiles the dashboard (dashboard/, Go) on the base image itself, so the cgo PAM binding
# links against the same glibc and libpam. Not the smaller almalinux:10 container: it lacks jq,
# so BlueBuild's setup script tries to install coreutils, which conflicts with its
# coreutils-single. On the bootc image /root points into /var, which is empty during a build,
# so Go's caches go in /tmp. Tests run first: a failing test fails the image build.
# common.yml copies the binary in.
stages:
  - name: dashboard
    from: ghcr.io/gamerx27/x27-base-almalinux-bootc:10
    modules:
      - type: containerfile
        snippets:
          - COPY dashboard /src
          - |
            RUN set -eu \
                && dnf -y install --setopt=install_weak_deps=False golang pam-devel \
                && cd /src \
                && export GOFLAGS=-mod=readonly CGO_ENABLED=1 GOPATH=/tmp/go GOCACHE=/tmp/go-cache \
                && go vet ./... \
                && go test ./... \
                && go build -trimpath -ldflags "-s -w -X main.version=$(date -u +%Y.%m.%d)" -o /out/dashboard . \
                && /out/dashboard help >/dev/null

modules:
  # Hardware firmware blobs and CPU microcode do nothing in a VM (the hypervisor handles
  # microcode). kernel-core only Recommends linux-firmware, so the kernel stays.
  # dnf4 has no --no-autoremove; clean_requirements_on_remove=False does the same. The guest
  # agent goes in here too: BlueBuild's dnf module needs dnf5.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && FIRMWARE="$(rpm -qa --queryformat '%{NAME}\n' | grep -E -- '-firmware$|^linux-firmware|^microcode_ctl$' || true)" \
            && echo "Removing:" ${FIRMWARE} \
            && if [ -n "${FIRMWARE}" ]; then dnf -y remove --setopt=clean_requirements_on_remove=False ${FIRMWARE}; fi \
            && dnf -y install --setopt=install_weak_deps=False qemu-guest-agent \
            && dnf clean all \
            && rpm -q kernel-core bootc qemu-guest-agent

  - type: systemd
    system:
      enabled:
        - qemu-guest-agent.service

  - from-file: common.yml
