---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

# Shared by recipe.yml (bare metal) and recipe-vm.yml. Each recipe runs its own
# hardware-specific modules first and pulls this in last, so the dnf guard stays the final step.
modules:
  - type: files
    files:
      - source: system
        destination: /

  # The web dashboard, built in the recipe's dashboard stage. Off until `dashboard enable`.
  - type: copy
    from: dashboard
    src: /out/dashboard
    dest: /usr/bin/dashboard

  # Podman out, Docker CE (download.docker.com) in. bootc hard-Requires podman, so a dnf
  # remove would take bootc with it; rpm -e --nodeps drops only podman. That breaks
  # bootc upgrade/switch (its image store runs podman), so updates go through rpm-ostree,
  # which pulls via skopeo. containerd.io conflicts with runc, hence --allowerasing.
  # The base has no dnf5 config-manager plugin, so the repo file is fetched with curl.
  # No weak deps keeps docker-ce-rootless-extras out. audit (auditd): fedora-bootc lacks it, and
  # without it the kernel prints every audit record (logins, service starts) to the console.
  # The Docker repo is removed again afterwards; the weekly rebuild picks up new versions.
  # nfs-utils and cifs-utils are for the dashboard's Storage page (NFS and SMB mounts).
  # NetBird comes from its own repo (pkgs.netbird.io) the same way. Its RPM scripts run
  # `netbird service install` and `start`, which fail in a build, so they're skipped;
  # netbird.service (files/system) replaces them and stays off until enabled.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && rpm -e --nodeps podman \
            && curl -fsSL -o /etc/yum.repos.d/docker-ce.repo \
                 https://download.docker.com/linux/fedora/docker-ce.repo \
            && printf '%s\n' '[netbird]' 'name=netbird' 'baseurl=https://pkgs.netbird.io/yum/' \
                 'enabled=1' 'gpgcheck=0' 'repo_gpgcheck=1' \
                 'gpgkey=https://pkgs.netbird.io/yum/repodata/repomd.xml.key' \
                 > /etc/yum.repos.d/netbird.repo \
            && dnf5 -y install --allowerasing --setopt=install_weak_deps=False \
                 docker-ce docker-ce-cli containerd.io \
                 docker-buildx-plugin docker-compose-plugin \
                 openssh-server htop audit fish wget git pciutils ncdu zip unzip jq nfs-utils cifs-utils \
            && dnf5 -y install --setopt=install_weak_deps=False --setopt=tsflags=noscripts netbird \
            && rm -f /etc/yum.repos.d/docker-ce.repo /etc/yum.repos.d/netbird.repo \
            && dnf5 clean all \
            && netbird completion fish > /usr/share/fish/vendor_completions.d/netbird.fish \
            && ! rpm -q podman \
            && rpm -q bootc docker-ce openssh-server audit fish git pciutils ncdu zip unzip jq nfs-utils cifs-utils netbird \
            && command -v wget

  - type: systemd
    system:
      enabled:
        - docker.service
        - sshd.service
        - auditd.service
        - fish-default-shell.service
        - docker-group.service
        - autoupdate-verify.service
      # Runs `bootc upgrade`, which fails without podman (see above).
      masked:
        - bootc-fetch-apply-updates.timer
        - bootc-fetch-apply-updates.service

  # Set directly here, not via BlueBuild's os-release module. The build number comes from
  # .github/workflows/build-image.yml (e.g. 2026.10.28.3-testing); a local build without it
  # uses the date.
  - type: containerfile
    snippets:
      # cosign.pub is always there, so the COPY doesn't fail when build-number isn't.
      - COPY cosign.pub build-numbe[r] /tmp/x27-build/
      - |
        RUN set -eu \
            && BUILD="$(cat /tmp/x27-build/build-number 2>/dev/null || date -u +%Y-%m-%d)" \
            && rm -rf /tmp/x27-build \
            && . /etc/os-release \
            && sed -i --follow-symlinks -e '/^NAME=/d' -e '/^PRETTY_NAME=/d' -e '/^BUILD_ID=/d' /etc/os-release \
            && printf 'NAME="X27-Linux Homelab"\nPRETTY_NAME="X27-Linux Homelab %s (%s)"\nBUILD_ID="%s-%s"\n' \
                 "${VERSION_ID}" "${BUILD}" "${VERSION_ID}" "${BUILD}" >> /etc/os-release

  # Last step: all dnf5 calls above are done. See files/system/usr/libexec/x27-dnf-guard.
  - type: containerfile
    snippets:
      - |
        RUN mv /usr/bin/dnf5 /usr/libexec/dnf5-real \
            && ln -s /usr/libexec/x27-dnf-guard /usr/bin/dnf5 \
            && test "$(readlink -f /usr/bin/dnf)" = /usr/libexec/x27-dnf-guard \
            && dnf5 --version

  - type: signing
